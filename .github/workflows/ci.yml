name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  esp32s3-build:
    name: ESP-IDF 5.3.5 / ESP32-S3 ${{ matrix.profile }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: [n8r8, tinys3d]
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Clean configure and build
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.3.5
          target: esp32s3
          path: .
          command: bash ci/build-esp32s3.sh ${{ matrix.profile }}

  python-host:
    name: Python host contracts
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install tooling dependencies
        run: pip install -r tools/requirements.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Run reset characterization tooling tests
        run: python -m unittest tools.tests.test_parsing -v
      - name: Compile Python sources
        run: python -m compileall -q cli tests tools
      - name: Verify invalid input returns exit 2
        shell: bash
        run: |
          set +e
          python -m cli.dragonbench run IDLE --duration 0
          status=$?
          set -e
          test "$status" -eq 2

  native-c:
    name: Native C state machine
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Compile with warnings and sanitizers
        run: >-
          gcc -std=c11 -Wall -Wextra -Wpedantic -Werror
          -fsanitize=address,undefined -fno-omit-frame-pointer
          -Ifirmware/common/include
          firmware/common/db_run.c firmware/common/db_network.c tests/native/test_db_run.c
          -o test_db_run
      - name: Execute state-machine test
        run: ./test_db_run
